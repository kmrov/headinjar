<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Head in Jar app icon">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a5c7ca" stop-opacity=".3"/>
      <stop offset=".45" stop-color="#789da4" stop-opacity=".08"/>
      <stop offset="1" stop-color="#789da4" stop-opacity=".24"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#4b9c9c"/>
      <stop offset="1" stop-color="#286879"/>
    </linearGradient>
    <clipPath id="inside">
      <path d="M135 137h242v226c0 26-20 46-46 46H181c-26 0-46-20-46-46z"/>
    </clipPath>
  </defs>

  <g transform="translate(-87 -87) scale(1.34)">

  <!-- The liquid and portrait stay within the jar's glass wall. -->
  <g clip-path="url(#inside)">
    <path d="M123 318c48-17 86 12 133 0s86-4 133 1v103H123z" fill="url(#liquid)"/>
    <path d="M124 321c50-17 83 11 132-1 46-11 90-4 133 0" fill="none" stroke="#9ad1c8" stroke-width="5" opacity=".65"/>

    <!-- A compact, original cartoon portrait, with no character likeness. -->
    <path d="M226 309h60l14 42c-24 18-64 18-88 0z" fill="#d78869" stroke="#462e42" stroke-width="8" stroke-linejoin="round"/>
    <path d="M188 249c-21-7-27 19-13 31 8 7 17 4 23 0m126-31c21-7 27 19 13 31-8 7-17 4-23 0" fill="#eca782" stroke="#462e42" stroke-width="8" stroke-linecap="round"/>
