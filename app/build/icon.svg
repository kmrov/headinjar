    <path d="M184 248c-15-36-10-73 12-91 1-22 25-32 45-26 16-17 39-18 55-4 36-6 57 22 52 49 10 20 1 49-20 66l-3-37c-12-3-24-10-33-21-27 18-62 23-91 15l-8 46z" fill="#b9c8cd" stroke="#462e42" stroke-width="9" stroke-linejoin="round"/>
    <path d="M203 186c34 11 69-1 91-19m5-25c22 9 35 25 38 44" fill="none" stroke="#eef1e7" stroke-width="11" stroke-linecap="round"/>
    <path d="M212 252c10-7 19-7 28-2m32 0c9-5 18-5 28 2" fill="none" stroke="#70828c" stroke-width="9" stroke-linecap="round"/>
    <path d="M220 228c10-3 20-2 29 0m15 0c10-2 20-3 29 0" fill="none" stroke="#b97868" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    <ellipse cx="227" cy="270" rx="6" ry="9" fill="#342b3e"/>
    <ellipse cx="285" cy="270" rx="6" ry="9" fill="#342b3e"/>
    <path d="M256 273l-6 22h12" fill="none" stroke="#bd715b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M229 306c9-8 17-7 27-3 10-4 18-5 27 3-2 9-13 10-27 7-14 3-25 2-27-7z" fill="#e4e6df" stroke="#687781" stroke-width="4" stroke-linejoin="round"/>
    <path d="M244 324c8 2 17 2 25 0" fill="none" stroke="#743f43" stroke-width="5" stroke-linecap="round"/>
    <path d="M202 281c-3 10-2 17 1 23m106-23c3 10 2 17-1 23" fill="none" stroke="#ba7c6b" stroke-width="4" stroke-linecap="round" opacity=".75"/>
  </g>

  <path d="M126 135h260v229c0 31-24 54-55 54H181c-31 0-55-23-55-54z" fill="url(#glass)" stroke="#a1c2c3" stroke-width="12" stroke-linejoin="round"/>
  <path d="M151 169v186c0 15 5 25 14 32" fill="none" stroke="#d3e5e0" stroke-width="10" stroke-linecap="round" opacity=".65"/>
  <path d="M360 180v171" fill="none" stroke="#d3e5e0" stroke-width="7" stroke-linecap="round" opacity=".4"/>

  <!-- Heavy metal lid makes the silhouette recognizable at dock size. -->
  <rect x="116" y="101" width="280" height="45" rx="13" fill="#788b95" stroke="#263944" stroke-width="10"/>
  <rect x="132" y="89" width="248" height="29" rx="10" fill="#abb9ba" stroke="#263944" stroke-width="9"/>
  <path d="M157 104h198" stroke="#dfe8e3" stroke-width="5" stroke-linecap="round" opacity=".75"/>
  <path d="M148 131h216" stroke="#536b77" stroke-width="6" stroke-linecap="round" opacity=".75"/>
  <circle cx="147" cy="124" r="5" fill="#374b55"/>
  <circle cx="365" cy="124" r="5" fill="#374b55"/>
